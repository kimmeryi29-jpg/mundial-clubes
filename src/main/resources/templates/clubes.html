<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: head('Clubes')}"></head>
<body>
<nav th:replace="~{fragments/plantilla :: encabezado('clubes')}"></nav>

<main class="container pb-5">
    <div th:replace="~{fragments/plantilla :: alertas}"></div>

    <div class="row g-4">
        <!-- FORMULARIO DEL CLUB CON SUS 4 RELACIONES -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-semibold"
                     th:text="${club.id == null} ? 'Nuevo club' : 'Editar club #' + ${club.id}">Nuevo club</div>
                <div class="card-body">
                    <form th:action="@{/clubes/guardar}" th:object="${club}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <!-- Errores de las reglas de relacion (uno a uno / uno a muchos) -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
                            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                        </div>

                        <div th:replace="~{fragments/plantilla :: campo('nombre', 'Nombre del club', 'text')}"></div>

                        <!-- @OneToOne -->
                        <div class="mb-3">
                            <label class="form-label" for="entrenadorId">
                                Entrenador</label>
                            <select th:field="*{entrenadorId}" class="form-select">
                                <option value="">-- Sin entrenador --</option>
                                <option th:each="e : ${entrenadores}" th:value="${e.id}"
                                        th:text="${e.nombreCompleto} + ' (' + ${e.nacionalidad} + ')'"></option>
                            </select>
                            <div class="form-text">Solo aparecen entrenadores que no dirigen otro club.</div>
                        </div>

                        <!-- @ManyToOne -->
                        <div class="mb-3">
                            <label class="form-label" for="asociacionId">
                                Asociación</label>
                            <select th:field="*{asociacionId}" class="form-select">
                                <option value="">-- Sin asociación --</option>
                                <option th:each="a : ${asociaciones}" th:value="${a.id}" th:text="${a.nombre}"></option>
                            </select>
                        </div>

                        <!-- @OneToMany -->
                        <div class="mb-3">
                            <label class="form-label d-block">
                                Jugadores</label>
                            <div class="lista-checks">
                                <p th:if="${#lists.isEmpty(jugadores)}" class="text-muted small mb-0">
                                    No hay jugadores libres. <a th:href="@{/jugadores}">Crear jugador</a></p>
                                <div class="form-check" th:each="j : ${jugadores}">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{jugadoresIds}" th:value="${j.id}">
                                    <label class="form-check-label" th:for="${#ids.prev('jugadoresIds')}"
                                           th:text="${j.numero} + ' - ' + ${j.nombreCompleto} + ' (' + ${j.posicion} + ')'"></label>
                                </div>
                            </div>
                            <div class="form-text">Solo aparecen jugadores sin club.</div>
                        </div>

                        <!-- @ManyToMany -->
                        <div class="mb-3">
                            <label class="form-label d-block">
                                Competiciones</label>
                            <div class="lista-checks">
                                <p th:if="${#lists.isEmpty(competiciones)}" class="text-muted small mb-0">
                                    No hay competiciones. <a th:href="@{/competiciones}">Crear competición</a></p>
                                <div class="form-check" th:each="c : ${competiciones}">
                                    <input class="form-check-input" type="checkbox"
                                           th:field="*{competicionesIds}" th:value="${c.id}">
                                    <label class="form-check-label" th:for="${#ids.prev('competicionesIds')}"
                                           th:text="${c.nombre}"></label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success"
                                    th:text="*{id} == null ? 'Guardar' : 'Actualizar'">Guardar</button>
                            <a th:href="@{/clubes}" class="btn btn-outline-secondary">Limpiar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- LISTA DE CLUBES -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-semibold">
                    Clubes <span class="badge bg-success" th:text="${#lists.size(lista)}">0</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-success">
                        <tr><th>ID</th><th>Club</th><th>Entrenador</th><th>Asociación</th>
                            <th class="text-center">Jugadores</th><th class="text-center">Compet.</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(lista)}">
                            <td colspan="7" class="text-center text-muted py-4">No hay clubes</td>
                        </tr>
                        <tr th:each="x : ${lista}">
                            <td th:text="${x.id}">1</td>
                            <td><a th:href="@{/clubes/{id}(id=${x.id})}" class="fw-semibold" th:text="${x.nombre}"></a></td>
                            <td th:text="${x.entrenador != null} ? ${x.entrenador.nombreCompleto} : '—'"></td>
                            <td th:text="${x.asociacion != null} ? ${x.asociacion.nombre} : '—'"></td>
                            <td class="text-center"><span class="badge bg-info" th:text="${#lists.size(x.jugadores)}"></span></td>
                            <td class="text-center"><span class="badge bg-warning text-dark" th:text="${#lists.size(x.competiciones)}"></span></td>
                            <td class="text-end text-nowrap">
                                <a th:href="@{/clubes/{id}(id=${x.id})}" class="btn btn-sm btn-primary" title="Ver">
                                    <i class="bi bi-eye"></i></a>
                                <a th:href="@{/clubes/editar/{id}(id=${x.id})}" class="btn btn-sm btn-warning" title="Editar">
                                    <i class="bi bi-pencil"></i></a>
                                <a th:href="@{/clubes/eliminar/{id}(id=${x.id})}" class="btn btn-sm btn-danger" title="Eliminar"
                                   onclick="return confirm('¿Eliminar el club? Sus jugadores y entrenador quedarán libres.');">
                                    <i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/plantilla :: pie}"></footer>
<th:block th:replace="~{fragments/plantilla :: scripts}"></th:block>
</body>
</html>
