spring.application.name=mundial

# Puerto asignado por el profesor: 8089.
# ${PORT:8089} = usa la variable PORT si existe (Render); si no, usa 8089.
server.port=${PORT:8089}

# La URL de MongoDB Atlas NO se escribe aqui, para no subir la contrasena a GitHub.
# - En tu PC: se lee del archivo .env (raiz del proyecto; Git lo ignora).
# - En Render: se configura la variable de entorno MONGODB_URI.
spring.config.import=optional:file:.env[.properties]

# Spring Boot 3.x usa spring.data.mongodb.uri; Spring Boot 4.x usa spring.mongodb.uri.
spring.data.mongodb.uri=${MONGODB_URI}
spring.mongodb.uri=${MONGODB_URI}

spring.thymeleaf.cache=false
